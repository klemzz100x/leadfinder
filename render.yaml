# Render Blueprint — LeadFinder
# Doc : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: leadfinder
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Le port est injecté automatiquement par Render via $PORT.
    # Le CMD du Dockerfile utilise le port 8000 ; Render redirige son $PORT vers 8000.
    plan: free                  # Tier gratuit — la base Postgres (Neon) est externe et persiste indépendamment.
    envVars:
      - key: DATABASE_URL
        sync: false            # À renseigner dans le dashboard Render : URL de connexion Neon.
      # Clés API optionnelles — à ajouter dans le dashboard Render si besoin :
      # - key: PSI_API_KEY
      #   sync: false
      # - key: GOOGLE_PLACES_API_KEY
      #   sync: false
      # - key: BRAVE_API_KEY
      #   sync: false
